name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-and-lint:
    name: 🛡️ Security Scan & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Scan for Secret Leaks (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 👕 Code Linting
        run: npm run lint

      - name: 🔬 TypeScript Typechecking
        run: npm run typecheck

      - name: 🛑 Dependency Vulnerability Audit
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: 🔍 SAST Code Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  build:
    name: 🏗️ Compile Production Bundle
    runs-on: ubuntu-latest
    needs: security-and-lint
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 💾 Inject Environment Secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "GOOGLE_SHEETS_SPREADSHEET_ID=${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}" >> .env

      - name: 🚀 Build Static Assets
        run: npm run build

      - name: 🗜️ Compress Build Folder
        run: tar -czf app.tar.gz dist/ server/ package.json package-lock.json .env

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: app.tar.gz
          retention-days: 2

  deploy-edge-functions:
    name: ☁️ Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔐 Login & Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set. Skipping Edge Function deploy."
            exit 0
          fi
          supabase login --token "$SUPABASE_ACCESS_TOKEN" || true
          supabase secrets set --project-ref eyajwjrafudarccvcada \
            GMAIL_USER="${{ secrets.GMAIL_USER }}" \
            GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}" || true
          supabase functions deploy send-ticket-email \
            --project-ref eyajwjrafudarccvcada || true
