<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backup Hard Disk Explorer - Guru Mobile & YantraByte</title>
  <script src="backup_data.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .logo-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: 13px;
      color: var(--text-muted);
    }
    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-badge {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-badge strong {
      color: var(--primary);
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 12px;
      align-items: center;
    }
    @media (max-width: 900px) {
      .controls-row {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 600px) {
      .controls-row {
        grid-template-columns: 1fr;
      }
    }
    .search-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px 12px 42px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }
    .select-control {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    .view-toggles {
      display: flex;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--card-bg);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 32px 12px;
      background: var(--bg);
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .categories-bar::-webkit-scrollbar {
      height: 4px;
    }
    .categories-bar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .cat-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .cat-chip:hover {
      background: var(--card-hover);
      color: #fff;
    }
    .cat-chip.active {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .cat-count {
      background: rgba(0,0,0,0.3);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
    }

    main {
      flex: 1;
      padding: 24px 32px;
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
    }
    .results-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .file-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .file-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .card-preview {
      height: 160px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .file-card:hover .card-preview img {
      transform: scale(1.05);
    }
    .file-icon-placeholder {
      font-size: 48px;
      color: var(--text-muted);
    }
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }
    .card-filename {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(51, 65, 85, 0.4);
    }
    .card-folder {
      font-size: 11px;
      color: var(--accent);
      background: rgba(129, 140, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 8px;
    }
    .btn-action {
      background: #090d16;
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Table Layout */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    th {
      background: #090d16;
      padding: 14px 18px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      color: #cbd5e1;
      vertical-align: middle;
    }
    tr:hover td {
      background: rgba(51, 65, 85, 0.3);
    }
    .table-name {
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .table-icon {
      font-size: 18px;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 32px 0 16px;
    }
    .page-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-btn.active {
      background: var(--primary);
      color: #000;
      font-weight: 700;
      border-color: var(--primary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .modal-preview-img {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .path-box {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 13px;
      color: var(--primary);
      word-break: break-all;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo-group">
        <div class="logo-icon">💾</div>
        <div>
          <div class="logo-title">Backup Drive Explorer (K:)</div>
          <div class="logo-sub">Search, organize & open your 4TB hard drive backup data effortlessly</div>
        </div>
      </div>
      <div class="stats-bar" id="statsBar">
        <div class="stat-badge">Total Files: <strong id="totalCount">0</strong></div>
        <div class="stat-badge">Total Size: <strong id="totalSize">0 GB</strong></div>
        <div class="stat-badge">Drive Space: <strong>3.68 TB Free</strong></div>
      </div>
    </div>

    <div class="controls-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name, folder, date (e.g. '2026-08', 'Invoice', 'IMG')..." />
      </div>
      
      <select id="yearMonthFilter" class="select-control">
        <option value="ALL">📅 All Dates</option>
      </select>

      <select id="sortControl" class="select-control">
        <option value="date-desc">⏱️ Newest First</option>
        <option value="date-asc">⏱️ Oldest First</option>
        <option value="size-desc">📦 Largest First</option>
        <option value="name-asc">🔤 Name (A - Z)</option>
      </select>

      <div class="view-toggles">
        <button id="btnGrid" class="view-btn active" onclick="setViewMode('grid')">🖼️ Cards</button>
        <button id="btnTable" class="view-btn" onclick="setViewMode('table')">📋 List</button>
      </div>
    </div>
  </header>

  <div class="categories-bar" id="categoriesBar"></div>

  <main>
    <div class="results-info">
      <span id="resultsCount">Showing 0 files</span>
      <span id="pageInfo"></span>
    </div>

    <div id="gridContainer" class="grid-container"></div>
    <div id="tableContainer" class="table-container" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Folder</th>
            <th>Size</th>
            <th>Date Modified</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination-bar" id="paginationBar"></div>
  </main>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle" style="color: #fff; font-size: 16px; word-break: break-all;">File Details</h3>
        <button onclick="closeModal()" style="background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div id="modalPreviewArea" style="width: 100%; text-align: center;"></div>
        <div class="path-box">
          <span id="modalPathText"></span>
          <button class="btn-action" onclick="copyModalPath()" style="white-space: nowrap;">📋 Copy Path</button>
        </div>
        <div style="display: flex; gap: 12px; width: 100%; justify-content: flex-end;">
          <a id="modalOpenBtn" href="#" class="btn-action" style="padding: 10px 20px; font-size: 14px; background: var(--primary); color: #000; font-weight: 700;">📂 Open in Browser</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✅ Path copied to clipboard!</div>

  <script>
    const data = window.BACKUP_DATA || [];
    let currentCategory = 'ALL';
    let currentSearch = '';
    let currentYearMonth = 'ALL';
    let currentSort = 'date-desc';
    let currentView = 'grid';
    let currentPage = 1;
    const pageSize = 48;
    let filteredData = [];

    const categoryIcons = {
      'ALL': '🌟',
      'Camera': '📷',
      'WhatsApp': '💬',
      'Screenshots': '📱',
      'Photos': '🖼️',
      'Documents': '📄',
      'Contacts': '👥',
      'Audio': '🎙️',
      'Videos': '🎥',
      'Archives & Apps': '📦',
      'Other': '📁'
    };

    function init() {
      // Calculate Stats
      document.getElementById('totalCount').textContent = data.length.toLocaleString();
      const totalBytes = data.reduce((acc, curr) => acc + (curr.size || 0), 0);
      document.getElementById('totalSize').textContent = (totalBytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";

      // Populate Categories Bar
      const counts = { ALL: data.length };
      const ymSet = new Set();

      data.forEach(item => {
        counts[item.category] = (counts[item.category] || 0) + 1;
        if (item.yearMonth) ymSet.add(item.yearMonth);
      });

      const catBar = document.getElementById('categoriesBar');
      const cats = ['ALL', 'Camera', 'WhatsApp', 'Screenshots', 'Documents', 'Contacts', 'Photos', 'Audio', 'Videos', 'Archives & Apps', 'Other'];
      
      cats.forEach(cat => {
        if (counts[cat] !== undefined) {
          const btn = document.createElement('button');
          btn.className = `cat-chip ${cat === 'ALL' ? 'active' : ''}`;
          btn.innerHTML = `${categoryIcons[cat] || '📁'} ${cat} <span class="cat-count">${(counts[cat] || 0).toLocaleString()}</span>`;
          btn.onclick = () => selectCategory(cat, btn);
          catBar.appendChild(btn);
        }
      });

      // Populate Year/Month dropdown
      const ymSelect = document.getElementById('yearMonthFilter');
      Array.from(ymSet).sort().reverse().forEach(ym => {
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `📅 ${ym}`;
        ymSelect.appendChild(opt);
      });

      // Listeners
      document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        currentPage = 1;
        applyFilters();
      });

      document.getElementById('yearMonthFilter').addEventListener('change', (e) => {
        currentYearMonth = e.target.value;
        currentPage = 1;
        applyFilters();
      });

      document.getElementById('sortControl').addEventListener('change', (e) => {
        currentSort = e.target.value;
        applyFilters();
      });

      applyFilters();
    }

    function selectCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentPage = 1;
      applyFilters();
    }

    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnTable').classList.toggle('active', mode === 'table');
      document.getElementById('gridContainer').style.display = mode === 'grid' ? 'grid' : 'none';
      document.getElementById('tableContainer').style.display = mode === 'table' ? 'block' : 'none';
      render();
    }

    function applyFilters() {
      filteredData = data.filter(item => {
        const matchesCategory = (currentCategory === 'ALL' || item.category === currentCategory);
        const matchesYM = (currentYearMonth === 'ALL' || item.yearMonth === currentYearMonth);
        const matchesSearch = !currentSearch || 
          item.name.toLowerCase().includes(currentSearch) ||
          item.folder.toLowerCase().includes(currentSearch) ||
          item.date.includes(currentSearch) ||
          item.ext.includes(currentSearch);
        return matchesCategory && matchesYM && matchesSearch;
      });

      // Sort
      filteredData.sort((a, b) => {
        if (currentSort === 'date-desc') return b.date.localeCompare(a.date);
        if (currentSort === 'date-asc') return a.date.localeCompare(b.date);
        if (currentSort === 'size-desc') return (b.size || 0) - (a.size || 0);
        if (currentSort === 'name-asc') return a.name.localeCompare(b.name);
        return 0;
      });

      render();
    }

    function render() {
      const total = filteredData.length;
      document.getElementById('resultsCount').textContent = `Showing ${total.toLocaleString()} files`;

      const startIdx = (currentPage - 1) * pageSize;
      const pageItems = filteredData.slice(startIdx, startIdx + pageSize);

      if (currentView === 'grid') {
        renderGrid(pageItems);
      } else {
        renderTable(pageItems);
      }

      renderPagination(total);
    }

    function getPreviewHtml(item) {
      const isImg = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'].includes(item.ext);
      if (isImg) {
        return `<img src="file:///${item.path}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'file-icon-placeholder\\'>🖼️</div>';" />`;
      }
      const icon = categoryIcons[item.category] || '📄';
      return `<div class="file-icon-placeholder">${icon}</div>`;
    }

    function renderGrid(items) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = items.map(item => `
        <div class="file-card">
          <div class="card-preview" onclick='openModal(${JSON.stringify(item)})'>
            ${getPreviewHtml(item)}
          </div>
          <div class="card-body">
            <div class="card-filename" title="${item.name}">${item.name}</div>
            <div class="card-meta">
              <span class="card-folder" title="${item.folder}">📁 ${item.folder}</span>
              <span>${item.sizeFormatted}</span>
            </div>
            <div style="font-size: 11px; color: var(--text-muted);">${item.date}</div>
            <div class="card-actions">
              <button class="btn-action" onclick='copyPath("${item.winPath.replace(/\\/g, '\\\\')}")'>📋 Copy Path</button>
              <a class="btn-action" href="file:///${item.path}" target="_blank">📂 Open</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderTable(items) {
      const body = document.getElementById('tableBody');
      body.innerHTML = items.map(item => `
        <tr>
          <td>
            <div class="table-name">
              <span class="table-icon">${categoryIcons[item.category] || '📄'}</span>
              <span title="${item.name}">${item.name}</span>
            </div>
          </td>
          <td><span style="font-size:12px; background:rgba(56, 189, 248, 0.1); color:var(--primary); padding:3px 8px; border-radius:4px;">${item.category}</span></td>
          <td><span class="card-folder">${item.folder}</span></td>
          <td>${item.sizeFormatted}</td>
          <td>${item.date}</td>
          <td>
            <div style="display:flex; gap:6px;">
              <button class="btn-action" onclick='copyPath("${item.winPath.replace(/\\/g, '\\\\')}")'>📋 Copy</button>
              <a class="btn-action" href="file:///${item.path}" target="_blank">📂 Open</a>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderPagination(total) {
      const totalPages = Math.ceil(total / pageSize) || 1;
      const bar = document.getElementById('paginationBar');
      
      let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">◀ Prev</button>`;
      
      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(totalPages, currentPage + 2);

      for (let p = startPage; p <= endPage; p++) {
        html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
      }

      html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next ▶</button>`;
      bar.innerHTML = html;
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    }

    function changePage(p) {
      currentPage = p;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let activeModalPath = '';
    function openModal(item) {
      activeModalPath = item.winPath;
      document.getElementById('modalTitle').textContent = item.name;
      document.getElementById('modalPathText').textContent = item.winPath;
      document.getElementById('modalOpenBtn').href = `file:///${item.path}`;

      const previewArea = document.getElementById('modalPreviewArea');
      const isImg = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'].includes(item.ext);
      if (isImg) {
        previewArea.innerHTML = `<img src="file:///${item.path}" class="modal-preview-img" onerror="this.parentElement.innerHTML='<div style=\\'font-size:64px;\\'>🖼️</div>';" />`;
      } else {
        previewArea.innerHTML = `<div style="font-size: 72px; padding: 20px;">${categoryIcons[item.category] || '📄'}</div><p style="color:var(--text-muted); font-size:14px;">${item.sizeFormatted} • ${item.date}</p>`;
      }

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(e) {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function copyModalPath() {
      copyPath(activeModalPath);
    }

    function copyPath(path) {
      navigator.clipboard.writeText(path).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
